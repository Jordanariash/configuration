server:
  port: ${GATEWAY_PORT:8082}

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      # CORRECCIÓN 1: El puerto correcto es 8761
      defaultZone: http://eureka-service:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: '*'
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: microservicio1
          # CORRECCIÓN 2: Usamos el nombre exacto de la app en Eureka
          uri: lb://microservicio1
          predicates:
            # CORRECCIÓN 3: "Atrapa todo". 
            # Como Nginx ya quitó el /api, lo que llega aquí (ej: /toolCategory) 
            # se lo pasamos directo al microservicio.
            - Path=/**
          # Quitamos StripPrefix porque Nginx ya limpió la URL.