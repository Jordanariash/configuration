server:
  port: ${GATEWAY_PORT:8082}

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka-service:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: '*'
            allowedMethods: "*"
            allowedHeaders: "*"
      
      routes:
        - id: microservicio
          uri: lb://MICROSERVICIO7
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
            
        - id: microservicio1
          uri: lb://MICROSERVICIO1
          predicates:
            - Path=/**
            
        - id: microservicio3
          uri: lb://MICROSERVICIO3
          predicates:
            - Path=/api/clients/**, /api/clientes/** 
          filters:
            - StripPrefix=1
            
        - id: microservicio5
          uri: lb://MICROSERVICIO5
          predicates:
            - Path=/api/move/**
          filters:
            - StripPrefix=1