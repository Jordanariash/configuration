server:
  # La magia: Si no inyectas nada, usa 0 (puerto aleatorio)
  port: ${PORT:${SERVER_PORT:0}}

eureka:
  instance:
    # Usar IP es crucial en Kubernetes porque los hostnames a veces son confusos para Eureka
    prefer-ip-address: true
    # El ID debe ser único para que Eureka no se confunda si hay réplicas
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${random.value}
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

# Opcional pero recomendado para ver qué puerto salió
management:
  endpoints:
    web:
      exposure:
        include: "*"
        
spring:
  datasource:
    # Aquí construimos la URL usando las variables de entorno
    # ${VARIABLE:valor_por_defecto_si_no_existe}
    url: jdbc:postgresql://${POSTGRES_DB_HOST:localhost}:${POSTGRES_DB_PORT:5432}/${POSTGRES_DB_NAME:microservicio1}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # O 'validate' si prefieres
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect